<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Vibra em Números</title>
<style>
  :root { --bg: #ffffff; --fg: #37373A; --muted: #66686b; --verde: #004415; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101310; --fg: #eceeea; --muted: #a6aca4; --verde: #86d663; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 22px; color: var(--verde); margin: 0 0 8px; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Vibra em Números</h1>
  <p>Acesso por convite. Se você recebeu o endereço do painel, abra o link completo que foi enviado a você.</p>
</main>
</body>
</html>

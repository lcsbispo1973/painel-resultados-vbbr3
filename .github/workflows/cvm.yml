name: Atualizar dados da CVM

# Baixa DFP e ITR da Vibra nos Dados Abertos da CVM, monta as séries trimestrais e roda as conferências.
# Resultado: data/cvm_*.json e logs/cvm-ultima-execucao.md
on:
  workflow_dispatch:
    inputs:
      completo:
        description: 'Refazer toda a série (baixa todos os anos)'
        type: boolean
        default: false
  push:
    paths:
      - 'pipeline/**'
      - 'docs/**'
      - '.github/workflows/cvm.yml'
  schedule:
    - cron: '17 9 * * *'   # diariamente, 06:17 em Brasília

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write   # alertas (novos documentos e falha na trava de publicação) viram issues, com aviso por e-mail

concurrency:
  group: atualizar-cvm
  cancel-in-progress: false

jobs:
  cvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testes automáticos do pipeline
        run: |
          python -I tests/test_cvm_fixture.py
          python -I tests/test_fre_fixture.py
          python -I tests/test_b3_fixture.py
          python -I tests/test_ipe_fixture.py
          node tests/test_dados.js

      - name: Baixar e processar dados da CVM
        run: |
          if [ "${{ inputs.completo }}" = "true" ]; then
            python pipeline/cvm.py --completo
          else
            python pipeline/cvm.py
          fi

      - name: Baixar e processar o Formulário de Referência
        if: always()
        run: |
          if [ "${{ inputs.completo }}" = "true" ]; then
            python pipeline/fre.py --completo
          else
            python pipeline/fre.py
          fi

      - name: Baixar cotações da B3
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ inputs.completo }}" = "true" ]; then python pipeline/b3.py --completo; else python pipeline/b3.py; fi

      - name: Baixar comunicados e fatos relevantes (IPE)
        if: always()
        continue-on-error: true
        run: python pipeline/ipe.py

      - name: Baixar releases de resultados e extrair o texto
        if: always()
        continue-on-error: true
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          python pipeline/releases.py
          python pipeline/releases_ler.py
          python -I tests/test_releases.py
          python pipeline/documentos.py
          python pipeline/ebitda_df.py
          python pipeline/ipiranga.py
          python pipeline/divida.py
          python pipeline/divida_release.py
          python pipeline/proventos.py
          python pipeline/releases_texto.py
          python pipeline/fre_mda.py
          python -I tests/test_documentos.py

      - name: Registro de mudanças
        if: always()
        continue-on-error: true
        run: python pipeline/registro.py

      - name: Salvar resultados no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza dados da CVM"
            git pull --rebase -X theirs -q origin main
            git push
          fi

      - name: Alerta de novos documentos
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s logs/novidades.md ]; then
            printf '\n@%s\n' "${{ github.repository_owner }}" >> logs/novidades.md
            gh issue create --repo "${{ github.repository }}" \
              --title "Novidades da Vibra na CVM — $(date -u +%d/%m/%Y)" \
              --body-file logs/novidades.md
          else
            echo "Nada novo."
          fi

  publicar:
    # Publica o painel (docs/ + data/*.json) no GitHub Pages. Requer Settings > Pages > Source: GitHub Actions.
    needs: cvm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Trava: se qualquer conferência falhar, nada é publicado e o painel continua na última versão aprovada.
      - name: Trava de publicação (conferência dos números)
        run: |
          python -I pipeline/validar.py
          node tests/test_dados.js

      - name: Alerta de falha na trava
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "A atualização de $(date -u +%d/%m/%Y) não foi publicada: alguma conferência dos números falhou."
            echo "O painel continua no ar com a última versão aprovada."
            echo
            cat logs/validacao.md 2>/dev/null || true
            echo
            echo "Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "@${{ github.repository_owner }}"
          } > alerta.md
          aberta=$(gh issue list --repo "${{ github.repository }}" --state open --search "Trava de publicação in:title" --json number --jq '.[0].number')
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" --repo "${{ github.repository }}" --body-file alerta.md
          else
            gh issue create --repo "${{ github.repository }}" --title "Trava de publicação: atualização retida" --body-file alerta.md
          fi

      - name: Montar o site
        run: |
          mkdir -p _site/data
          cp -r docs/. _site/
          cp data/*.json _site/data/
          cp -r data/fre _site/data/fre
          rm -f _site/data/release_segmentos.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

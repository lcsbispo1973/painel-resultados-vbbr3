name: Diagnóstico RAD (temporário)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Consultar RAD
        run: python tools/diag_rad.py diag_rad || true
      - name: Publicar resultado num ramo separado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diagnostico-rad
          git rm -rfq --cached . >/dev/null
          git add -f diag_rad
          git commit -qm "Diagnóstico RAD $(date -u +%FT%TZ)"
          git push -f origin diagnostico-rad

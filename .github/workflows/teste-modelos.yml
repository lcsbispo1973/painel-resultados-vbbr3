name: Teste GitHub Models

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: atualizar-cvm
  cancel-in-progress: false

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Chamar GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs
          {
            echo "# Teste GitHub Models — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for m in openai/gpt-4.1 openai/gpt-4.1-mini openai/gpt-4o; do
              echo; echo "## $m"
              curl -sS -m 60 -w '\nHTTP %{http_code}\n' https://models.github.ai/inference/chat/completions \
                -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
                -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Responda apenas: ok\"}],\"max_tokens\":5}" | head -c 1500
            done
          } > logs/teste-modelos.md
          cat logs/teste-modelos.md
      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/teste-modelos.md
          git commit -m "Teste GitHub Models" && git pull --rebase -X theirs -q origin main && git push || true

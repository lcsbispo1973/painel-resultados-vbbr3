name: Verificar links

# Abre cada link do painel (documentos da CVM) e registra os que não funcionam. Semanal e sob demanda.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 11 * * 1'   # segundas, 08:41 em Brasília

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar-cvm
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar links
        run: python pipeline/verificar_links.py
      - name: Salvar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f logs/links_exemplo.html.keep; git add data/links.json logs/links.md logs/links_exemplo.html 2>/dev/null || git add data/links.json logs/links.md
          if ! git diff --cached --quiet; then
            git commit -m "Verificação de links"
            git pull --rebase -X theirs -q origin main
            git push
          fi
      - name: Alerta de links quebrados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python -c "import json;print(len(json.load(open('data/links.json'))['quebrados']))")
          if [ "$n" -gt 0 ]; then
            { echo "$n link(s) do painel não abriram o documento na última verificação."; echo; head -80 logs/links.md; echo; echo "@lcsbispo1973"; } > alerta.md
            gh issue create --repo "${{ github.repository }}" --title "Links quebrados no painel — $(date -u +%d/%m/%Y)" --body-file alerta.md
          fi

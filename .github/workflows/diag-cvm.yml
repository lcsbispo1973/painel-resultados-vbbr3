name: Diagnóstico CVM (FRE e histórico)
on:
  workflow_dispatch:
  push:
    paths: ['pipeline/diag_cvm.py', '.github/workflows/diag-cvm.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python pipeline/diag_cvm.py
      - name: Salvar log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git diff --cached --quiet || { git commit -m "Log do diagnóstico CVM"; git pull --rebase -q origin main; git push; }

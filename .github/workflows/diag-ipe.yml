name: Diagnóstico IPE (temporário)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Testar download pelo protocolo
        run: |
          mkdir -p logs
          python3 - <<'P' > logs/diag-ipe.txt 2>&1 || true
          import re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120) as r:
                  return r.read(), r.headers.get("Content-Type")
          for u in ["https://www.rad.cvm.gov.br/ENET/frmDownloadDocumento.aspx?Tela=ext&descTipo=IPE&CodigoInstituicao=1&numProtocolo=1558260",
                    "https://www.rad.cvm.gov.br/ENET/frmDownloadDocumento.aspx?Tela=ext&descTipo=IPE&CodigoInstituicao=1&numProtocolo=1558260&numSequencia=0&numVersao=1",
                    "https://www.rad.cvm.gov.br/ENETWEB/frmDownloadDocumento.aspx?Tela=ext&descTipo=IPE&CodigoInstituicao=1&numProtocolo=1558260"]:
              try:
                  b, ct = get(u); print("download", len(b), ct, b[:8], u[-80:])
              except Exception as e: print("ERRO", repr(e), u[-80:])
          for u in ["https://www.rad.cvm.gov.br/ENET/frmExibirArquivoIPEExterno.aspx?NumeroProtocoloEntrega=1558260",
                    "https://www.rad.cvm.gov.br/ENETWEB/frmExibirArquivoIPEExterno.aspx?ID=1558260"]:
              b, ct = get(u); t = b.decode("utf-8", "replace")
              print("\nvisualizador", u[-60:], len(t))
              for m in sorted(set(re.findall(r'(?:src|href|value|action)="([^"]{0,300})"', t)))[:60]: print("  ", m)
              for m in re.findall(r"(?i)(sequen\w*\W{1,5}\w{0,20})", t)[:20]: print("  seq:", m)
          P
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/diag-ipe.txt && git commit -qm "Diagnóstico IPE" && git pull -q --rebase origin main && git push -q

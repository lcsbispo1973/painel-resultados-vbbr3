name: Diagnóstico (temporário)
on:
  push:
    paths: ['diag/**', '.github/workflows/diag.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - run: python diag/diag_mda.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/diag-mda.md && git commit -m "Diagnóstico MD&A" && git pull --rebase -q origin main && git push || true

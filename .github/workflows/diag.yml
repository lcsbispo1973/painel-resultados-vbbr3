name: Diagnóstico de links (temporário)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps webkit chromium
          mkdir -p diag
          python tools/diag_links.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -qm "diagnóstico de links" && git pull -q --rebase && git push -q || true

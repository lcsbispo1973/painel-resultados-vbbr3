name: Teste de exportação no iPhone (temporário)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps webkit
          python tools/teste_iphone.py || true
          rm -f diag/*.pdf diag/*.xlsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -qm "teste de exportação no iPhone" && git pull -q --rebase && git push -q || true

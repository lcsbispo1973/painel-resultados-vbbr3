name: MD&A redigido (manual)

# Gera ou refaz o texto do MD&A sob demanda. Ex.: pares "2T26|T|2T25|T"; vazio = os pendentes, mais recentes primeiro.
on:
  workflow_dispatch:
    inputs:
      pares:
        description: 'Pares (A|base|B|base), separados por vírgula; vazio = pendentes'
        required: false
        default: ''
      refazer:
        description: 'Refazer mesmo os já aprovados'
        type: boolean
        default: false
      maximo:
        description: 'Máximo de pares nesta execução'
        default: '12'

permissions:
  contents: write

concurrency:
  group: atualizar-cvm
  cancel-in-progress: false

jobs:
  mda:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # em lotes, gravando no repositório a cada lote: uma falha no meio não perde o que já foi redigido
      - name: Redigir e salvar em lotes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MDA_IA_PARES: ${{ inputs.pares }}
          MDA_IA_REFAZER: ${{ inputs.refazer && '1' || '' }}
          TOTAL: ${{ inputs.maximo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node pipeline/mda_fatos.js
          feitos=0
          while [ "$feitos" -lt "${TOTAL:-12}" ]; do
            MDA_IA_MAX=8 python pipeline/mda_ia.py | tee /tmp/saida.txt
            feitos=$((feitos + 8))
            git add -A data logs
            if ! git diff --cached --quiet; then
              git commit -q -m "MD&A redigido (lote)"
              for t in 1 2 3; do
                git pull -q --rebase --autostash -X theirs origin main && git push -q && break
                sleep 10
              done
            fi
            grep -q "^PENDENTES=0" /tmp/saida.txt && break
            [ -n "$MDA_IA_REFAZER" ] && break
          done
